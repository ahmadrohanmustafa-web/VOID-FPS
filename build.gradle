plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Minecraft 26.1+ is unobfuscated and Loom's non-remapping plugin uses
    // normal Gradle configurations instead of the legacy modImplementation.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.register('selfTest', JavaExec) {
    dependsOn classes, testClasses
    classpath = sourceSets.main.output + sourceSets.test.output
    mainClass = 'dev.voidfps.surface.SelfTest'
}

check.dependsOn selfTest

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
