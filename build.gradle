plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Minecraft 26.1+ is unobfuscated and Loom's non-remapping plugin uses
    // normal Gradle configurations instead of the legacy modImplementation.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// The engine-independent self-test must stay runnable without Minecraft's
// Loom-managed runtime. Native Minecraft recorder checks belong in the test client.
tasks.register('selfTest', JavaExec) {
    dependsOn classes, testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.voidfps.surface.SelfTest'
}

// A separate test mod loads only in the dedicated test-client run. It reuses
// compiled test fixtures without adding any test code to the released mod.
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    testmodImplementation.extendsFrom testImplementation
    testmodRuntimeOnly.extendsFrom testRuntimeOnly
}

// The project currently uses a standalone main-based self-test suite rather
// than JUnit. Gradle's default test task sees test sources but discovers no
// framework tests; don't fail the build for that. The selfTest task above
// executes the dependency-free core self-test suite and remains part of "check". Minecraft-dependent recorder checks run only in the Loom test-client environment.
test {
    failOnNoDiscoveredTests = false
}

check.dependsOn selfTest

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

// A separate development-client run configuration adds test classes to the
// runtime classpath without putting anything from src/test into the shipped JAR.
loom {
    mods {
        "voidfps" {
            sourceSet sourceSets.main
        }
        "voidfps-test" {
            sourceSet sourceSets.testmod
        }
    }
    runs {
        testClient {
            inherit client
            displayName = "VOID FPS Test Client"
            sourceSet = sourceSets.testmod.name
            runDirectory = file("run/test-client")
        }
    }
}

/**
 * Release-safety gate: Minecraft-dependent recorder fixtures and the dedicated
 * test mod must never leak into the production artifact.
 */
tasks.register('verifyProductionJarIsolation') {
    dependsOn tasks.named('jar')
    doLast {
        def productionJar = tasks.named('jar').get().archiveFile.get().asFile
        def archive = zipTree(productionJar)
        def testClasses = archive.matching {
            include '**/*Test*.class'
            include '**/testmod/**'
        }.files
        if (!testClasses.isEmpty()) {
            throw new GradleException(
                    "Production JAR contains test-only classes: "
                            + testClasses.collect { it.name }.sort())
        }

        def metadataFiles = archive.matching {
            include 'fabric.mod.json'
        }.files
        if (metadataFiles.size() != 1) {
            throw new GradleException(
                    "Expected exactly one production fabric.mod.json, found "
                            + metadataFiles.size())
        }
        def metadata = metadataFiles.first().getText('UTF-8')
        if (metadata.contains('voidfps-test') || metadata.contains('testmod')) {
            throw new GradleException(
                    "Production fabric.mod.json references the test-only mod")
        }

        // Rendering hooks are intentionally not shipped until a Minecraft 26.3
        // injection point and full-section parity have both been proven.
        def metadataObject = new groovy.json.JsonSlurper().parseText(metadata)
        if (metadataObject.containsKey('mixins')) {
            throw new GradleException(
                    "Production mod metadata declares mixins before renderer verification")
        }
        def mixinConfigs = archive.matching {
            include '*.mixins.json'
            include '**/*.mixins.json'
        }.files
        if (!mixinConfigs.isEmpty()) {
            throw new GradleException(
                    "Production JAR contains unapproved mixin configuration: "
                            + mixinConfigs.collect { it.name }.sort())
        }
        def entrypoint = archive.matching {
            include 'dev/voidfps/client/VoidFpsClient.class'
        }.files
        if (entrypoint.size() != 1) {
            throw new GradleException(
                    "Production JAR is missing its single expected client entrypoint")
        }
        logger.lifecycle(
                "VOID FPS production JAR safety passed: testOnlyClasses=0, "
                        + "testModMetadata=false, mixinConfigs=0, "
                        + "clientEntrypoint=1, artifact=" + productionJar.name)
    }
}

check.dependsOn tasks.named('verifyProductionJarIsolation')
