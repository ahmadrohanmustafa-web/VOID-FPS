plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Minecraft 26.1+ is unobfuscated and Loom's non-remapping plugin uses
    // normal Gradle configurations instead of the legacy modImplementation.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.register('selfTest', JavaExec) {
    dependsOn classes, testClasses
    // Include Loom's resolved Minecraft runtime as well as the normal test
    // runtime. The recorder implements Minecraft's VertexConsumer interface,
    // so output-only classpaths fail when the self-test instantiates it.
    classpath = sourceSets.test.runtimeClasspath + configurations.minecraft
    mainClass = 'dev.voidfps.surface.SelfTest'
}

// The project currently uses a standalone main-based self-test suite rather
// than JUnit. Gradle's default test task sees test sources but discovers no
// framework tests; don't fail the build for that. The selfTest task above
// executes the standalone self-test suite, including the test-only native vertex recorder contract, and remains part of "check".
test {
    failOnNoDiscoveredTests = false
}

check.dependsOn selfTest

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

// A separate development-client run configuration adds test classes to the
// runtime classpath without putting anything from src/test into the shipped JAR.
loom {
    runs {
        testClient {
            inherit client
            displayName = "VOID FPS Test Client"
            sourceSet = sourceSets.test.name
            runDirectory = file("run/test-client")
        }
    }
}
