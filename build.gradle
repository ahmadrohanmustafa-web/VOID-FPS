// UNVERIFIED: written without Gradle available. The core has no Minecraft dependency.
plugins {
    id 'java-library'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) } // MC 26.x baseline; code is also valid on 21
}

sourceSets {
    test { java { srcDir 'src/test/java' } }
}

tasks.register('selfTest', JavaExec) {
    dependsOn classes, testClasses
    classpath = sourceSets.main.output + sourceSets.test.output
    mainClass = 'dev.voidfps.surface.SelfTest'
}
check.dependsOn selfTest
