# Builds the mod with JDK 25 + Gradle 9.6.0 and dumps the real
# Minecraft 26.3 method signatures so mixin targets can be verified without a local setup.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle build --no-daemon

      - name: Launch Minecraft 26.3 test client (startup smoke test)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libglx-mesa0
          set +e
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            bash -c 'glxinfo -B > build/void-fps-glx-info.log 2>&1 || true; exec env SDL_VIDEO_FORCE_EGL=1 LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe GALLIUM_DRIVER=llvmpipe gradle runTestClient --no-daemon' \
            > build/void-fps-client-smoke.log 2>&1
          status=$?
          set -e
          cat build/void-fps-client-smoke.log
          if [ "$status" -ne 0 ]; then
            echo "Minecraft test client exited with status $status."
            exit "$status"
          fi
          grep -q "VOID FPS loaded. No block/terrain optimizations are active" build/void-fps-client-smoke.log
          grep -q "VOID FPS native putBlockBakedQuad UV and emission test passed" build/void-fps-client-smoke.log
          grep -q "VOID FPS resource-loaded stone model snapshot passed" build/void-fps-client-smoke.log
          grep -q "VOID FPS real resource-pack override passed: selected through PackRepository, Minecraft reload completed, stone model snapshot differs from vanilla, six-face full-cube geometry remains eligible" build/void-fps-client-smoke.log
          grep -q "VOID FPS real partial-geometry resource-pack override passed: live reload exposed half-height model and native eligibility required vanilla fallback" build/void-fps-client-smoke.log
          grep -q "VOID FPS real internal-geometry resource-pack override passed: live reload exposed enclosed extra element and native eligibility required vanilla fallback" build/void-fps-client-smoke.log
          grep -q "VOID FPS real unculled-geometry resource-pack override passed: live reload captured unculled quad and native eligibility required vanilla fallback" build/void-fps-client-smoke.log
          grep -q "VOID FPS real duplicate-boundary resource-pack override passed: live reload exposed 12 boundary quads and native eligibility required vanilla fallback" build/void-fps-client-smoke.log
          grep -q "VOID FPS real tinted-material resource-pack override passed: six-face geometry remained valid but tint metadata required vanilla fallback" build/void-fps-client-smoke.log
          grep -q "VOID FPS original resource-pack selection restored and temporary folder removed" build/void-fps-client-smoke.log
          grep -q "VOID FPS native eligibility matrix passed: accepted=10, tintedFallback=grass_block" build/void-fps-client-smoke.log
          grep -q "VOID FPS native fallback matrix passed: modelChecks=5, rejected=6, vanillaFallbackRequired=true" build/void-fps-client-smoke.log
          grep -Fq 'VOID FPS native fallback model inspection passed: block=Block{minecraft:oak_slab},' build/void-fps-client-smoke.log
          grep -Fq 'VOID FPS native fallback model inspection passed: block=Block{minecraft:oak_fence},' build/void-fps-client-smoke.log
          grep -Fq 'VOID FPS native fallback model inspection passed: block=Block{minecraft:glass_pane},' build/void-fps-client-smoke.log
          grep -Fq 'VOID FPS native fallback model inspection passed: block=Block{minecraft:oak_leaves},' build/void-fps-client-smoke.log
          grep -Fq 'VOID FPS native fallback model inspection passed: block=Block{minecraft:torch},' build/void-fps-client-smoke.log
          grep -q "VOID FPS candidate native vertex-output parity passed: scenario=isolated, vertices=24, exact=true, cacheScope=shared" build/void-fps-client-smoke.log
          grep -q "VOID FPS candidate native vertex-output parity passed: scenario=section-region, vertices=24, exact=true, cacheScope=shared" build/void-fps-client-smoke.log
          grep -q "VOID FPS candidate native vertex-output parity passed: scenario=section-region-EAST, vertices=20, exact=true, cacheScope=shared" build/void-fps-client-smoke.log
          grep -q "VOID FPS real RenderSectionRegion fixture passed: sections=27, centerAndSixNeighboursExact=true, lightingSource=liveClientLevel" build/void-fps-client-smoke.log
          if grep -q "VOID FPS test-world bootstrap failed" build/void-fps-client-smoke.log; then
            echo "Minecraft test-world integration reported a failure."
            exit 1
          fi
          grep -Fq 'VOID FPS additional full-cube native parity passed: state=' build/void-fps-client-smoke.log
          test "$(grep -Fc 'VOID FPS additional full-cube native parity passed: state=' build/void-fps-client-smoke.log)" -eq 20
          test "$(grep -Fc 'deterministicSeeds=4' build/void-fps-client-smoke.log)" -eq 20
          grep -q "VOID FPS test world disconnected through normal save lifecycle" build/void-fps-client-smoke.log
          echo "Minecraft client loaded VOID FPS and passed native vertex-output and resource-loaded block-model checks."

      - name: Dump Minecraft 26.3 target signatures
        if: always()
        continue-on-error: true
        run: python3 tools/inspect_targets.py --bytecode --out build/void-fps-inspect

      - name: Dump native vertex output APIs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/void-fps-inspect
          MC_JAR="$(find "$HOME/.gradle/caches/fabric-loom" -name 'minecraft-client.jar' -print -quit)"
          if [ -z "$MC_JAR" ]; then echo "Minecraft client jar not found"; exit 0; fi
          javap -c -p -classpath "$MC_JAR" com.mojang.blaze3d.vertex.QuadInstance com.mojang.blaze3d.vertex.VertexConsumer net.minecraft.util.LightCoordsUtil net.minecraft.client.model.geom.builders.UVPair > build/void-fps-inspect/vertex-output.bytecode.txt


      - name: Dump vanilla block rendering bytecode
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/void-fps-inspect/vanilla-bytecode
          MC_JAR="$(find "$HOME/.gradle/caches/fabric-loom" -name 'minecraft-client.jar' -print -quit)"
          if [ -z "$MC_JAR" ]; then echo "Minecraft client jar not found"; exit 0; fi
          classes=(
            net.minecraft.client.Minecraft
            net.minecraft.client.gui.screens.worldselection.WorldOpenFlows
            net.minecraft.client.gui.screens.worldselection.CreateWorldScreen
            net.minecraft.client.gui.screens.ConfirmScreen
            net.minecraft.client.gui.components.AbstractWidget
            net.minecraft.client.gui.components.AbstractWidget\$WithInactiveMessage
            net.minecraft.client.gui.components.events.AbstractContainerEventHandler
            net.minecraft.client.gui.screens.Screen
            net.minecraft.client.gui.screens.AccessibilityOnboardingScreen
            net.minecraft.client.gui.Gui
            net.minecraft.client.server.IntegratedServer
            net.minecraft.client.multiplayer.ClientChunkCache
            net.minecraft.client.multiplayer.ClientLevel
            net.minecraft.world.level.chunk.LevelChunk
            net.minecraft.world.level.chunk.ChunkAccess
            net.minecraft.world.level.chunk.status.ChunkStatus
            net.minecraft.client.gui.components.events.AbstractContainerEventHandler
            net.minecraft.client.gui.components.events.GuiEventListener
            net.minecraft.client.gui.components.AbstractButton
            net.minecraft.client.gui.components.Button
            net.minecraft.network.chat.Component
            net.minecraft.network.chat.contents.TranslatableContents
            com.mojang.blaze3d.platform.Window
            net.minecraft.client.MouseHandler
            net.minecraft.client.input.MouseButtonEvent
            net.minecraft.client.input.MouseButtonInfo
            net.minecraft.client.input.KeyEvent
            net.minecraft.client.gui.components.AbstractButton
            net.minecraft.client.gui.components.Button
            net.minecraft.client.gui.components.Button\$OnPress
            net.minecraft.client.input.InputWithModifiers
            net.minecraft.client.gui.components.events.GuiEventListener
            net.minecraft.client.gui.components.events.ContainerEventHandler
            net.minecraft.client.gui.components.events.GuiEventListener\$Event
            net.minecraft.client.gui.screens.worldselection.CreateWorldCallback
            net.minecraft.client.gui.screens.worldselection.WorldCreationUiState
            net.minecraft.client.gui.screens.worldselection.WorldCreationUiState\$SelectedGameMode
            net.minecraft.client.gui.screens.worldselection.InitialWorldCreationOptions
            net.minecraft.client.gui.screens.worldselection.CreateWorldCallback
            net.minecraft.client.gui.screens.worldselection.WorldCreationContextMapper
            net.minecraft.client.gui.screens.worldselection.DataPackReloadCookie
            net.minecraft.world.level.levelgen.FlatLevelSource
            net.minecraft.world.level.levelgen.WorldGenSettings
            net.minecraft.world.level.dimension.LevelStem
            net.minecraft.world.level.levelgen.presets.WorldPreset
            net.minecraft.world.level.levelgen.flat.FlatLevelGeneratorPreset
            net.minecraft.world.level.levelgen.flat.FlatLevelGeneratorSettings
            net.minecraft.world.level.levelgen.structure.StructureSet
            net.minecraft.world.level.levelgen.placement.PlacedFeature
            net.minecraft.world.level.storage.LevelStorageSource
            net.minecraft.server.MinecraftServer
            net.minecraft.server.WorldStem
            net.minecraft.world.level.levelgen.WorldOptions
            net.minecraft.world.level.levelgen.WorldDimensions
            net.minecraft.world.level.LevelSettings
            net.minecraft.world.level.WorldDataConfiguration
            net.minecraft.world.level.GameType
            net.minecraft.world.Difficulty
            net.minecraft.world.level.storage.LevelDataAndDimensions
            net.minecraft.world.level.storage.WorldData
            net.minecraft.world.level.storage.LevelStorageSource\$LevelStorageAccess
            net.minecraft.server.WorldLoader
            net.minecraft.server.packs.repository.ServerPacksSource
            net.minecraft.client.gui.screens.worldselection.WorldCreationContext
            net.minecraft.world.level.gamerules.GameRules
            net.minecraft.world.level.levelgen.flat.FlatLevelGeneratorSettings
            net.minecraft.world.level.levelgen.FlatLevelSource
            net.minecraft.world.level.levelgen.WorldGenSettings
            net.minecraft.world.level.dimension.LevelStem
            net.minecraft.world.level.LevelSettings\$DifficultySettings
            net.minecraft.world.level.DataPackConfig
            net.minecraft.world.level.validation.DirectoryValidator
            net.minecraft.world.level.storage.LevelDataAndDimensions\$WorldDataAndGenSettings
            net.minecraft.server.WorldLoader\$InitConfig
            net.minecraft.server.WorldLoader\$PackConfig
            net.minecraft.server.WorldLoader\$DataLoadContext
            net.minecraft.server.WorldLoader\$ResultFactory
            net.minecraft.server.WorldLoader\$WorldDataSupplier
            net.minecraft.client.gui.screens.worldselection.InitialWorldCreationOptions
            net.minecraft.world.level.levelgen.presets.WorldPresets
            net.minecraft.client.gui.screens.Screen
            net.minecraft.client.resources.model.ModelManager
            net.minecraft.client.renderer.block.ModelBlockRenderer
            net.minecraft.client.renderer.block.BlockModelLighter
            net.minecraft.client.renderer.block.BlockQuadOutput
            net.minecraft.client.renderer.block.dispatch.BlockStateModelPart
            net.minecraft.client.renderer.block.dispatch.BlockStateModel
            net.minecraft.client.resources.model.geometry.BakedQuad
            net.minecraft.client.resources.model.geometry.BakedQuad\$MaterialInfo
            net.minecraft.client.renderer.block.BlockAndTintGetter
            net.minecraft.client.renderer.chunk.RenderSectionRegion
            net.minecraft.client.renderer.chunk.SectionCopy
            net.minecraft.world.level.chunk.LevelChunk
            net.minecraft.world.level.chunk.LevelChunkSection
            net.minecraft.client.multiplayer.ClientLevel
            net.minecraft.client.multiplayer.ClientPacketListener
            net.minecraft.client.multiplayer.ClientLevel\$ClientLevelData
            net.minecraft.client.renderer.extract.LevelExtractor
            net.minecraft.client.multiplayer.ClientChunkCache
            net.minecraft.client.server.IntegratedServer
            net.minecraft.world.level.dimension.DimensionType
            net.minecraft.world.level.chunk.ChunkAccess
            net.minecraft.client.renderer.chunk.SectionCompiler
          )
          for class in "${classes[@]}"; do
            file="build/void-fps-inspect/vanilla-bytecode/${class##*.}.bytecode.txt"
            echo "===== $class =====" > "$file"
            javap -c -p -classpath "$MC_JAR" "$class" >> "$file" 2>&1 || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: void-fps-build
          path: |
            build/libs/*.jar
            build/void-fps-inspect/
            build/void-fps-client-smoke.log
            build/void-fps-glx-info.log
