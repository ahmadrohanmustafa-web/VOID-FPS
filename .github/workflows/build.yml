# Builds the mod with JDK 25 + Gradle 9.6.0 and dumps the real
# Minecraft 26.3 method signatures so mixin targets can be verified without a local setup.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle build --no-daemon

      - name: Launch Minecraft 26.3 test client (startup smoke test)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libglx-mesa0
          set +e
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            bash -c 'glxinfo -B > build/void-fps-glx-info.log 2>&1 || true; exec env SDL_VIDEO_FORCE_EGL=1 LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe GALLIUM_DRIVER=llvmpipe gradle runTestClient --no-daemon' \
            > build/void-fps-client-smoke.log 2>&1
          status=$?
          set -e
          cat build/void-fps-client-smoke.log
          if [ "$status" -ne 0 ]; then
            echo "Minecraft test client exited with status $status."
            exit "$status"
          fi
          grep -q "VOID FPS loaded. No block/terrain optimizations are active" build/void-fps-client-smoke.log
          grep -q "VOID FPS native putBlockBakedQuad UV and emission test passed" build/void-fps-client-smoke.log
          grep -q "VOID FPS resource-loaded stone model snapshot passed" build/void-fps-client-smoke.log
          echo "Minecraft client loaded VOID FPS and passed native vertex-output and resource-loaded block-model checks."

      - name: Dump Minecraft 26.3 target signatures
        if: always()
        continue-on-error: true
        run: python3 tools/inspect_targets.py --bytecode --out build/void-fps-inspect

      - name: Dump native vertex output APIs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/void-fps-inspect
          MC_JAR="$(find "$HOME/.gradle/caches/fabric-loom" -name 'minecraft-client.jar' -print -quit)"
          if [ -z "$MC_JAR" ]; then echo "Minecraft client jar not found"; exit 0; fi
          javap -c -p -classpath "$MC_JAR" com.mojang.blaze3d.vertex.QuadInstance com.mojang.blaze3d.vertex.VertexConsumer net.minecraft.util.LightCoordsUtil net.minecraft.client.model.geom.builders.UVPair > build/void-fps-inspect/vertex-output.bytecode.txt


      - name: Dump vanilla block rendering bytecode
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/void-fps-inspect/vanilla-bytecode
          MC_JAR="$(find "$HOME/.gradle/caches/fabric-loom" -name 'minecraft-client.jar' -print -quit)"
          if [ -z "$MC_JAR" ]; then echo "Minecraft client jar not found"; exit 0; fi
          classes=(
            net.minecraft.client.Minecraft
            net.minecraft.client.resources.model.ModelManager
            net.minecraft.client.renderer.block.ModelBlockRenderer
            net.minecraft.client.renderer.block.BlockModelLighter
            net.minecraft.client.renderer.block.BlockQuadOutput
            net.minecraft.client.renderer.block.dispatch.BlockStateModelPart
            net.minecraft.client.renderer.block.dispatch.BlockStateModel
            net.minecraft.client.resources.model.geometry.BakedQuad
            net.minecraft.client.resources.model.geometry.BakedQuad\$MaterialInfo
            net.minecraft.client.renderer.block.BlockAndTintGetter
            net.minecraft.client.renderer.chunk.RenderSectionRegion
            net.minecraft.client.renderer.chunk.SectionCopy
            net.minecraft.world.level.chunk.LevelChunk
            net.minecraft.world.level.chunk.LevelChunkSection
            net.minecraft.client.multiplayer.ClientLevel
            net.minecraft.client.multiplayer.ClientPacketListener
            net.minecraft.client.multiplayer.ClientLevel\$ClientLevelData
            net.minecraft.client.renderer.extract.LevelExtractor
            net.minecraft.client.multiplayer.ClientChunkCache
            net.minecraft.client.server.IntegratedServer
            net.minecraft.world.level.dimension.DimensionType
            net.minecraft.world.level.chunk.ChunkAccess
            net.minecraft.client.renderer.chunk.SectionCompiler
          )
          for class in "${classes[@]}"; do
            file="build/void-fps-inspect/vanilla-bytecode/${class##*.}.bytecode.txt"
            echo "===== $class =====" > "$file"
            javap -c -p -classpath "$MC_JAR" "$class" >> "$file" 2>&1 || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: void-fps-build
          path: |
            build/libs/*.jar
            build/void-fps-inspect/
            build/void-fps-client-smoke.log
            build/void-fps-glx-info.log
