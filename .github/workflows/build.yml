name: Build VOID FPS Core
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build mod
        run: gradle --no-daemon clean build
      - name: Upload remapped mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: void-fps-core
          path: build/libs/*.jar
          if-no-files-found: error
