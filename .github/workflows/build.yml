# UNTESTED workflow. Builds the mod with JDK 25 + Gradle 9.6.0 and dumps the real
# Minecraft 26.3 method signatures so mixin targets can be verified without a local setup.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle build --no-daemon

      - name: Dump Minecraft 26.3 target signatures
        if: always()
        continue-on-error: true
        run: python3 tools/inspect_targets.py --bytecode --out build/void-fps-inspect

      - name: Dump native vertex output APIs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/void-fps-inspect
          MC_JAR="$(find "$HOME/.gradle/caches/fabric-loom" -name 'minecraft-client.jar' -print -quit)"
          if [ -z "$MC_JAR" ]; then echo "Minecraft client jar not found"; exit 0; fi
          javap -p -classpath "$MC_JAR" com.mojang.blaze3d.vertex.QuadInstance com.mojang.blaze3d.vertex.VertexConsumer > build/void-fps-inspect/vertex-output.bytecode.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: void-fps-build
          path: |
            build/libs/*.jar
            build/void-fps-inspect/
